[package]
name = "wrangler-server"
version = "0.1.0"
description = "Service manager with multi-user API with full access to the local machine "
edition = "2021"
license = "MIT"
repository = "https://github.com/The-Process-Foundry/SubmissionWrangler"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]


# Local Code
wrangler-common = {path = "../common"}

# Global IDs
uuid = {version = "1.8.0", features = ["v4", "v5", "serde", "js"]}

# Date/Time code
chrono = "0.4.37"

# Service: Database
neo4rs = {version = "0.7.1"}

# Async code?
futures = { version = "0.3.30" }
tokio = { version = "1.37.0", features = ["full"] }
tokio-rustls = "0.26.0"

# Logging/instrumentation
tracing = "0.1.40"

# Serializing conmmunications
serde = {version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"