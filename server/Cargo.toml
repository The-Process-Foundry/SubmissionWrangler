[package]
description = "Service manager with multi-user API with full access to the local machine "
edition = "2021"
license = "MIT"
name = "wrangler-server"
repository = "https://github.com/The-Process-Foundry/SubmissionWrangler"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]

# Project data common to both the client and server
wrangler-common = {path = "../common"}

# Global ID
uuid = {version = "1.11.0", features = ["v4", "serde"]}

# Date/Time code
chrono = "0.4.38"

# Service: Database
neo4rs = {version = "0.8.0"}

# Async code?
futures = {version = "0.3.31"}
tokio = {version = "1.41.1", features = ["full"]}
tokio-rustls = "0.26.0"

# Logging/instrumentation
tracing = "0.1.41"

# Serializing conmmunications
serde = {version = "1.0.215", features = ["derive"]}
serde_json = "1.0.133"

# regular expressions
regex = "1.11.1"

# Decimal numbers
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"

# Minipulate tabular data for Import/Export
csv = "1.3.1"
