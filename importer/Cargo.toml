[package]
name = "wrangler-importer"
version = "0.1.0"
description = "Read CSV files and load them into the database"
edition = "2021"
license = "MIT"
repository = "https://github.com/The-Process-Foundry/SubmissionWrangler"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]


# Local Code
# wrangler-common = {path = "../common"}

# Read the user data from FHL
csv = "1.3.1"

# Date/Time
chrono = "0.4.38"

# Work with money in decimal number instead of floats
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"

# Global IDs
uuid = {version = "1.11.0", features = ["v4", "v5", "serde", "js"]}

# Service: Database
neo4rs = {version = "0.8.0"}

# Async code?
futures = { version = "0.3.31" }
tokio = { version = "1.41.1", features = ["full"] }
tokio-rustls = "0.26.0"

# Parse JSON
serde = {version = "1.0.215", features = ["derive"]}
serde_json = "1.0.133"
regex = "1.11.1"
